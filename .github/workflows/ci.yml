name: CI

# Branch pushes are covered by the pull_request trigger, so restricting push to
# main keeps a PR from running the whole matrix twice — once for its branch and
# once for the PR. Dependabot's branches live in this repo, which is what made
# the duplication routine rather than occasional.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # 8.2 is the floor declared in composer.json; 8.5 is what islam.zmo.de
      # actually runs, so leaving it out meant never testing the deployed
      # version. Both ends of the supported range need to stay covered.
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Syntax check
        run: |
          find . -path ./vendor -prune -o \( -name '*.php' -o -name '*.phtml' \) -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # The other half of `composer check`. Kept off the matrix: PSR-12 compliance
  # and the PHPStan result do not vary across 8.2–8.5, so running them four
  # times would quadruple the wall clock for no extra signal.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Lint & analyse
    steps:
      - uses: actions/checkout@v7

      # 8.2 is the module's declared floor, and phpstan.neon.dist sets no
      # phpVersion — PHPStan reports against the version it runs on, so
      # analysing at the floor is what would catch a violation of it. The
      # matrix above is what covers 8.5, the deployed version.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Each check runs even when an earlier one fails, so a push reports every
      # category at once rather than revealing them one re-run at a time. The
      # job still fails if any of them does.
      - name: Translation template is current
        run: composer i18n:check

      - name: Coding standard (PSR-12)
        if: ${{ !cancelled() }}
        run: composer lint

      - name: Static analysis (PHPStan level 6)
        if: ${{ !cancelled() }}
        run: composer analyse

      # The translation template needs PHP to *fix*, not just to detect, and
      # this module is developed without it. The gate should now only fire
      # when the set of translatable strings genuinely changes — its `#:`
      # references carry no line numbers — but that still means a new string
      # cannot be extracted locally. On failure, regenerate and publish the
      # template so it can be committed back.
      #
      # Deliberately not doing the same for phpstan-baseline.neon: with the
      # baseline in `includes`, its own entries are already suppressed during
      # analysis, so regenerating here would emit a baseline covering only the
      # *new* errors and silently drop the recorded debt. Regenerating it is a
      # deliberate act — see the header of phpstan.neon.dist.
      - name: Regenerate the translation template
        if: ${{ failure() }}
        run: composer i18n

      - name: Upload the regenerated template
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: language
          path: language/
          if-no-files-found: error

  # This is deliberately separate from the fast unit matrix. Omeka owns the
  # Laminas/PSR runtime, so install the real application and load its vendor
  # tree before the module's development-only vendor. The integration suite
  # checks framework contracts and wiring without growing tests/Shim/omeka.php.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Omeka S 4.2.1 / PHP 8.5
    steps:
      - uses: actions/checkout@v7

      - name: Check out Omeka S
        uses: actions/checkout@v7
        with:
          repository: omeka/omeka-s
          ref: v4.2.1
          path: .integration/omeka-s

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          extensions: mbstring, pdo_mysql

      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-integration-${{ hashFiles('composer.json', '.integration/omeka-s/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-integration-
            ${{ runner.os }}-composer-

      - name: Install module development tools
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install Omeka runtime
        run: composer install --working-dir=.integration/omeka-s --no-dev --prefer-dist --no-interaction --no-progress

      - name: Run real-framework integration tests
        env:
          OMEKA_PATH: ${{ github.workspace }}/.integration/omeka-s
        run: composer test:integration
