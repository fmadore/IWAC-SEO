name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 8.2 is the floor declared in composer.json; 8.5 is what islam.zmo.de
      # actually runs, so leaving it out meant never testing the deployed
      # version. Both ends of the supported range need to stay covered.
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    name: PHP ${{ matrix.php }}
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax check
        run: |
          find . -path ./vendor -prune -o \( -name '*.php' -o -name '*.phtml' \) -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  # The other half of `composer check`. Kept off the matrix: PSR-12 compliance
  # and the PHPStan result do not vary across 8.2–8.4, so running them three
  # times would triple the wall clock for no extra signal.
  quality:
    runs-on: ubuntu-latest
    name: Lint & analyse
    steps:
      - uses: actions/checkout@v7

      # 8.2 is the module's declared floor, and phpstan.neon.dist sets no
      # phpVersion — PHPStan reports against the version it runs on, so
      # analysing at the floor is what would catch a violation of it. The
      # matrix above is what covers 8.5, the deployed version.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      # Each check runs even when an earlier one fails, so a push reports every
      # category at once rather than revealing them one re-run at a time. The
      # job still fails if any of them does.
      - name: Translation template is current
        run: composer i18n:check

      - name: Coding standard (PSR-12)
        if: ${{ !cancelled() }}
        run: composer lint

      - name: Static analysis (PHPStan level 6)
        if: ${{ !cancelled() }}
        run: composer analyse

      # TEMPORARY. This module is developed on a machine with no PHP, so CI is
      # the only place PHPStan can run at all — including the initial baseline
      # of pre-existing findings. Generate it and publish it as an artifact so
      # it can be committed; delete these two steps once it is in the repo.
      - name: Generate PHPStan baseline
        if: ${{ !cancelled() }}
        run: vendor/bin/phpstan analyse --generate-baseline=phpstan-baseline.neon --allow-empty-baseline

      - name: Upload PHPStan baseline
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: phpstan-baseline
          path: phpstan-baseline.neon
          if-no-files-found: error
