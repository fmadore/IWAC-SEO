# Dependabot watches the only two things in this repo that can go stale on
# their own: the action pins in the CI workflow, and the three dev tools in
# composer.json. There are no runtime dependencies and vendor/ is never
# committed, so none of this is about security patches — it is about learning
# that a new major exists, on a branch where CI can say whether it breaks the
# gate.
#
# Cooldown: a release is proposed only once it is five days old, as in
# IwacSearch, IWAC-theme and IwacVisualizations. A compromised or broken
# publish is usually yanked within days. It applies to the actions too: their
# pins are commit SHAs, but Dependabot is what moves a pin onto a new release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      actions:
        patterns: ["*"]

  # composer.lock is deliberately not committed, so Dependabot can only rewrite
  # the constraint in composer.json, and only when a release falls outside it —
  # in practice a major bump of PHPUnit, PHPStan or PHP_CodeSniffer. Grouped so
  # that two landing in the same month stay a single PR.
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 5
    groups:
      dev-tools:
        patterns: ["*"]
